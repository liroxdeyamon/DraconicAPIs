<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="onloaded" style="display: none;">
        <h1>Bare bones API usage</h1>
        <h2>NUMEBRS TOOL</h2>
        <h3>May be incorrect on large numbers or upon editing short number (#nmbr)!</h3>
        <div>
            <input type="number" id="numInput0" placeholder="number" style="display: flex; width: 100%;">
            <input type="text" id="numInput1" placeholder="text" style="display: flex; width: 100%;">
            <input type="short" id="numInput2" placeholder="short" style="display: flex; width: 100%;">
        </div>
        <h2>TRANSLATING TOOL</h2>
        <div>
            <input type="text" id="txtInput1" name="text" id="translator" placeholder="text in draconic" style="display: flex; width: 100%;">
            <button type="button" id="translate_button1" style="display: flex;">Parse words (not tested)</button>
            <ul id="result1"></ul>
        </div>
        <div>
            <input type="text" id="txtInput2" name="text" id="translator" placeholder="description in english (leave empty for most short defenitions)" style="display: flex; width: 100%;">
            <input type="number" id="limit" placeholder="limit (default 10)" style="display: flex; width: 100%;">
            <button type="button" id="translate_button2" style="display: flex">Parse words by description</button>
            <ul id="result2"></ul>
        </div>
    </div>

<script type="module">
    import { DIALECTS } from "https://draconicconlang.github.io/APIs/dialects/DialectLoader.js";
    const DR = await DIALECTS.load("dr_dr");
    Object.assign(globalThis, DR);

    const onloaded = document.getElementById("onloaded")

    const txtInput1 = document.getElementById("txtInput1")
    const translate_button1 = document.getElementById("translate_button1")
    const result1 = document.getElementById("result1")

    const txtInput2 = document.getElementById("txtInput2")
    const translate_button2 = document.getElementById("translate_button2")
    const result2 = document.getElementById("result2")
    const limit = document.getElementById("limit")


    const numInput0 = document.getElementById("numInput0")
    const numInput1 = document.getElementById("numInput1")
    const numInput2 = document.getElementById("numInput2")

    function test_translate1() {
        result1.innerHTML = "";
        txtInput1.value.split(" ").forEach(word => {
            const obj = DICTIONARY.fuzzyFetchByWord(word)[0];
            const prefix = AFFIXES.PREFIXES.match(word, AFFIXES.PREFIXES.MATCHES)?.[0]?.affix ?? "";
            const suffix = AFFIXES.SUFFIXES.match(word, AFFIXES.SUFFIXES.MATCHES)?.[0]?.affix ?? "";
            result1.innerHTML += `<li>${obj.type} | ${prefix}- ${obj.text} (${obj.declension}) -${suffix} - ${obj.definition}</li>`;
        });
    }

    function test_translate2() {
        result2.innerHTML = "";
        DICTIONARY.fuzzyFetchByDefinition(txtInput2.value, parseInt(limit.value || 10)).forEach(obj => {
            result2.innerHTML += `<li>${obj.type} | ${obj.text} (${obj.declension}) - ${obj.definition}</li>`;
        })
    }


    function test_numbers0() {
        const int = parseInt(numInput0.value);
        if (int >= 0) {
            numInput1.value = NUMBERS.numberToText(int);
            numInput2.value = NUMBERS.numberToTextShort(int);
        }
    }

    function test_numbers1() {
        numInput1.value = "Editing this is not supported yet.";
    }

    function test_numbers2() {
        if (numInput2.value.startsWith("#")) {
            const int = NUMBERS.textToNumberShort(numInput2.value);
            numInput0.value = int;
            numInput1.value = NUMBERS.numberToText(int);
            
        }
    }

    numInput0.addEventListener("input", test_numbers0)
    numInput1.addEventListener("input", test_numbers1)
    numInput2.addEventListener("input", test_numbers2)

    translate_button1.addEventListener("click", test_translate1);
    translate_button2.addEventListener("click", test_translate2);

    onloaded.style.display = "block"
</script>
<script type="module">

</script>
</body>
</html>
